name: lola install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [claude-code, opencode]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js (for the merval mermaid linter the skill bundles)
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install lola from main
        run: uv tool install --force git+https://github.com/LobsterTrap/lola

      - name: Stage working tree (lola's mod-add walker reads git ls-files)
        run: |
          git config user.email ci@example
          git config user.name ci
          git add -A

      - name: Install module
        env:
          TARGET: ${{ matrix.target }}
        run: task install:lola ASSISTANT="$TARGET"

      - name: Verify install destination
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            claude-code)
              test -f ~/.claude/skills/docs-organization/SKILL.md
              test -f ~/.claude/skills/adr/SKILL.md
              # `node_modules/` is in lola's ALWAYS_IGNORE list, so the merval
              # linter does NOT ship with the install. The skill detects this
              # at first /diagram-test invocation and reports a
              # MERVAL_NOT_INSTALLED finding with the exact `npm install`
              # command to run. That's the supported workflow — the assertion
              # is the skill's own self-check, not a CI assertion.
              for cmd in docs-init docs-audit docs-update diagram-test adr-new adr-review; do
                test -f ~/.claude/commands/"$cmd".md
              done
              grep -q '<!-- lola:module:docs-discipline:start -->' ~/.claude/CLAUDE.md
              ;;
            opencode)
              test -f ~/.opencode/commands/docs-init.md
              grep -q '<!-- lola:module:docs-discipline:start -->' ~/AGENTS.md
              ;;
          esac

      - name: Uninstall
        env:
          TARGET: ${{ matrix.target }}
        run: task uninstall:lola ASSISTANT="$TARGET"
