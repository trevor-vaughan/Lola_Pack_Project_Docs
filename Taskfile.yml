version: '3'

# This Taskfile is for *developers of this pack*. End users install the pack
# into their AI assistant directly via lola:
#
#     lola mod add <repo-url>
#     lola install docs-discipline
#
# The targets below set up a developer's local environment so the pack is
# both runnable (tests, lint) and live in their own AI assistant (via
# lola) for self-testing.

tasks:
  default:
    cmds:
      - task --list-all

  install:
    desc: 'Install this pack into the local AI assistant via lola + npm deps for local dev (ASSISTANT=, SCOPE=user|project)'
    cmds:
      # `install:scripts` runs `npm install` in the source `scripts/` dir so
      # `task test:diagrams` and `task lint` work locally. It is NOT a
      # prerequisite for the lola install — lola excludes `node_modules/`
      # from the install (see ALWAYS_IGNORE in its parsers.py). End users
      # who hit the `MERVAL_NOT_INSTALLED` finding run `npm install` at
      # the destination as the skill instructs.
      - task: install:scripts
      - task: install:lola

  install:lola:
    desc: 'Register and install this pack via lola (https://lobstertrap.org/lola/). Defaults to claude-code @ user scope. Override with ASSISTANT=<x> SCOPE=<user|project>.'
    vars:
      ASSISTANT: '{{.ASSISTANT | default "claude-code"}}'
      SCOPE: '{{.SCOPE | default "user"}}'
    requires:
      vars:
        - name: SCOPE
          enum: [user, project]
    preconditions:
      - sh: command -v lola
        msg: |
          lola is not installed. End users install this pack via lola — see
          https://lobstertrap.org/lola/ for installation instructions.
          If you only want to run the test suite, use: task install:scripts
      # Require lola >= 0.4.5 (PR #121 added gitignore-aware module copy + module-subtree
      # detection. Earlier versions copy the entire repo including .venv/, .git/, etc.,
      # which is slow and confuses the `mod add` walker.)
      - sh: |
          ver=$(lola --version 2>&1 | awk '{print $2}' | head -1 | cut -d. -f1-3)
          [ "$(printf '%s\n%s\n' '0.4.5' "$ver" | sort -V | head -1)" = "0.4.5" ]
        msg: "lola >= 0.4.5 required. Upgrade with: uv tool install --force git+https://github.com/LobsterTrap/lola"
    cmds:
      - lola mod add --name docs-discipline .
      - lola install docs-discipline -a {{.ASSISTANT}} --scope {{.SCOPE}} {{.CLI_ARGS}}

  install:scripts:
    desc: Install npm dependencies for the docs-organization scripts (merval + markdown-it)
    cmds:
      - cd module/skills/docs-organization/scripts && npm install

  uninstall:
    desc: Tear down everything this Taskfile installed — DESTRUCTIVE
    cmds:
      - task: uninstall:lola
      - task: uninstall:scripts

  uninstall:lola:
    desc: 'Uninstall this pack via lola. Mirrors install: override with ASSISTANT=<x> SCOPE=<user|project>.'
    vars:
      ASSISTANT: '{{.ASSISTANT | default "claude-code"}}'
      SCOPE: '{{.SCOPE | default "user"}}'
    requires:
      vars:
        - name: SCOPE
          enum: [user, project]
    preconditions:
      - sh: command -v lola
        msg: lola is not installed — nothing to uninstall.
    cmds:
      - lola uninstall docs-discipline -a {{.ASSISTANT}} --scope {{.SCOPE}} -f
      # Deregister the module from lola's registry only when no installations
      # remain anywhere. `lola mod rm` does NOT clean up installs — running it
      # prematurely orphans skills/commands/managed-section markers on other
      # hosts/scopes. Parse `lola list` to confirm the module is gone.
      - |
        if ! lola list 2>/dev/null | grep -q '^docs-discipline$'; then
          lola mod rm -f docs-discipline
        fi

  uninstall:scripts:
    desc: Remove the docs-organization scripts' node_modules — DESTRUCTIVE
    prompt: Remove module/skills/docs-organization/scripts/node_modules?
    cmds:
      - rm -rf module/skills/docs-organization/scripts/node_modules

  test:
    desc: Run all tests
    deps: [lint:module, test:unit, test:bash, test:e2e]

  lint:module:
    desc: Validate the lola module layout (AGENTS.md, SKILL.md frontmatter, command frontmatter, anchor instructions)
    cmd: bash scripts/lint-module.sh .

  test:unit:
    desc: Run node:test unit tests
    cmds:
      - cd module/skills/docs-organization/scripts && npm test

  test:bash:
    desc: Run bash script tests
    cmds:
      - bash module/skills/docs-organization/scripts/check-structure.test.sh
      - bash module/skills/docs-organization/scripts/check-staleness.test.sh
      - bash module/skills/adr/scripts/adr-index.test.sh

  test:e2e:
    desc: Run end-to-end Venom suite
    vars:
      REPO_ROOT:
        sh: pwd
    cmds:
      - mkdir -p .test-output
      - venom run tests/e2e/docs-discipline.venom.yml --output-dir=.test-output --var="WORKDIR={{.REPO_ROOT}}"

  lint:
    desc: Lint every mermaid diagram in the pack's own project docs
    cmds:
      - node module/skills/docs-organization/scripts/lint-mermaid.mjs module/ README.md

  test:diagrams:
    desc: Lint and render every mermaid fixture under tests/diagrams/ (light + dark backgrounds, output in .test-output/diagrams/)
    cmds:
      - mkdir -p .test-output/diagrams
      - node module/skills/docs-organization/scripts/lint-mermaid.mjs tests/diagrams/ > .test-output/diagrams/lint.json || true
      - bash {{.ROOT_DIR}}/scripts/render-diagrams.sh {{.ROOT_DIR}}/tests/diagrams {{.ROOT_DIR}}/.test-output/diagrams {{.ROOT_DIR}}/module/skills/docs-organization/reference/palettes/er-overrides.css
      - cat .test-output/diagrams/manifest.txt

  render:
    desc: 'Render a single .mmd file to PNG against light + dark backgrounds with the skill''s CSS override applied. Usage: task render -- path/to/diagram.mmd'
    cmds:
      - mkdir -p .test-output/render
      - mmdc -i {{.CLI_ARGS}} -o .test-output/render/{{base .CLI_ARGS | replace ".mmd" ""}}.light.png -b white --cssFile module/skills/docs-organization/reference/palettes/er-overrides.css --quiet
      - mmdc -i {{.CLI_ARGS}} -o .test-output/render/{{base .CLI_ARGS | replace ".mmd" ""}}.dark.png  -b "#1e1e1e" --cssFile module/skills/docs-organization/reference/palettes/er-overrides.css --quiet
      - 'echo "Rendered to .test-output/render/"'

  palette:
    desc: 'Swap palette on an existing .mmd file. Usage: task palette -- <solar|federation|citrus|parchment> path/to/diagram.mmd. Writes to stdout — redirect to overwrite.'
    cmds:
      - bash {{.ROOT_DIR}}/module/skills/docs-organization/scripts/swap-palette.sh {{.CLI_ARGS}}
